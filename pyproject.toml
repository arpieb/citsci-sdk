[project]
name = "citsci-sdk"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "ppsr-core @ git+https://github.com/arpieb/ppsr-core.git",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.10",
    "pre-commit>=3.7",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=citsci_sdk --cov-report=term-missing"

[tool.coverage.run]
source = ["citsci_sdk"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
