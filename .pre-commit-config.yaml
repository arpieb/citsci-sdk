# Mirrors the CI checks in .github/workflows/ci.yml so failures surface before push.
# Set up once per clone with: uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the `ruff` pin in pyproject.toml's dev extra.
    rev: v0.15.15
    hooks:
      # `ruff check` (add `args: [--fix]` here to auto-fix instead of only failing).
      - id: ruff-check
      # `ruff format --check`.
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
